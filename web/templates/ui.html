<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08090b" />
  <title>NAMNESIS Control Surface</title>
  <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="/static/img/logo_s.png" type="image/png" />
  <link rel="stylesheet" href="/static/tailwind.css" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app-shell">
    <header class="instrument-header">
      <div class="brand-block">
        <img src="/static/img/logo.svg" alt="NAMNESIS" class="brand-logo logo-white" />
      </div>

      <div class="header-telemetry">
        <div class="stream-pill" title="Gateway event stream">
          <span id="streamDot" class="stream-dot" data-state="connecting"></span>
          <span id="streamStatus">CONNECTING</span>
        </div>
        <div class="metric-pill"><span>UI</span><strong id="now">— ms</strong></div>
        <div id="status" class="metric-pill status-pill" data-state="loading">loading</div>

        <label class="follow-control" title="Follow changes from MIDI and other controllers">
          <span id="refreshModeLabel">FOLLOW</span>
          <input id="refreshModeToggle" type="checkbox" checked />
          <span class="follow-switch" aria-hidden="true"></span>
        </label>
        <button id="manualRefreshBtn" class="ghost-button hidden" type="button">Sync now</button>
      </div>

      <div id="sysStatusBar" class="system-strip" aria-label="System status">
        <span id="sysReady" class="system-ready">—</span>
        <span id="sysXruns">XRUNS —</span>
        <span id="sysLatency">LAT —</span>
        <span id="sysMidi">MIDI —</span>
        <span id="sysIF">IF —</span>
      </div>
    </header>

    <section class="command-deck" aria-label="Amp and preset controls">
      <div class="preset-control">
        <label for="presetSelect">Preset</label>
        <select id="presetSelect"></select>
      </div>

      <div id="modelSelectors" class="model-controls"></div>

      <div class="preset-actions">
        <button id="savePresetBtn" class="primary-button" type="button">Save</button>
        <button id="savePresetAsBtn" class="secondary-button" type="button">Save as</button>
        <button id="deletePresetBtn" class="danger-button" type="button">Delete</button>
      </div>
    </section>

    <section class="section-panel core-panel" aria-labelledby="core-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Fixed signal path</p>
          <h2 id="core-title">Input · Tonestack · Master</h2>
        </div>
        <span class="section-note">Global controls</span>
      </div>
      <div id="coreRow" class="core-grid"></div>
    </section>

    <main>
      <section class="section-panel chains-panel" aria-labelledby="chains-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Editable processing</p>
            <h2 id="chains-title">Signal chains</h2>
          </div>
          <span class="section-note">Changes are pushed from Stompbox</span>
        </div>

        <div class="chain-tabs" role="tablist" aria-label="Signal chain">
          <button type="button" data-chain-tab="Input" role="tab">Input</button>
          <button type="button" data-chain-tab="FxLoop" role="tab">FX loop</button>
          <button type="button" data-chain-tab="Output" role="tab">Output</button>
        </div>

        <div id="lanesRow" class="chains-grid" data-active-chain="Input"></div>
      </section>

      <details class="section-panel slots-panel">
        <summary>
          <span>
            <span class="eyebrow">Topology</span>
            <strong>Plugin slots</strong>
          </span>
          <span class="summary-hint">Inspect</span>
        </summary>
        <div id="slotsRow" class="slots-row"></div>
      </details>

      <details class="debug-panel">
        <summary>Diagnostics</summary>
        <div id="debug"></div>
      </details>
    </main>
  </div>

  <script defer src="/static/util.js"></script>
  <script defer src="/static/api.js"></script>
  <script defer src="/static/parse.js"></script>
  <script defer src="/static/render.js"></script>
  <script defer src="/static/app.js"></script>
</body>
</html>
